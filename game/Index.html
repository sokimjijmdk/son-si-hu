
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>두더지 잡기 게임</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px 15px;
      min-height: 100vh;
      font-family: sans-serif;
      background: #e8f5e9;
      text-align: center;
      color: #24452d;
    }

    .game {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      padding: 25px 15px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 5px 20px #00000015;
    }

    h1 {
      margin: 5px 0 10px;
      font-size: 28px;
    }

    .description {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .info {
      display: flex;
      justify-content: space-around;
      gap: 8px;
      margin: 20px 0;
    }

    .info-box {
      flex: 1;
      padding: 12px 5px;
      background: #e8f5e9;
      border-radius: 15px;
    }

    .info-box p {
      margin: 0 0 5px;
      font-size: 13px;
      color: #66806a;
    }

    .info-box strong {
      font-size: 25px;
      color: #2e7d32;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 25px auto;
      width: 100%;
    }

    .hole {
      aspect-ratio: 1 / 1;
      border: none;
      border-radius: 50%;
      background: #a5d6a7;
      box-shadow: inset 0 7px 0 #81b784;
      font-size: clamp(35px, 11vw, 55px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .hole:active {
      transform: scale(0.94);
    }

    .hole .mole {
      display: none;
    }

    .hole.active .mole {
      display: block;
    }

    .start-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      background: #43a047;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .start-button:active {
      transform: scale(0.98);
    }

    #message {
      min-height: 28px;
      margin-top: 18px;
      font-size: 16px;
      font-weight: bold;
      color: #388e3c;
    }

    .tip {
      margin-top: 15px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🐹 두더지 잡기!</h1>
    <div class="description">
      나타나는 두더지를 빠르게 터치해 봐!
    </div>

    <div class="info">
      <div class="info-box">
        <p>내 점수</p>
        <strong id="score">0</strong>
      </div>

      <div class="info-box">
        <p>남은 시간</p>
        <strong id="time">30</strong>
      </div>

      <div class="info-box">
        <p>최고 기록</p>
        <strong id="best">0</strong>
      </div>
    </div>

    <div class="board" id="board">
      <button class="hole"><span class="mole">🐹</span></button>
      <button class="hole"><span class="mole">🐹</span></button>
      <button class="hole"><span class="mole">🐹</span></button>
      <button class="hole"><span class="mole">🐹</span></button>
      <button class="hole"><span class="mole">🐹</span></button>
      <button class="hole"><span class="mole">🐹</span></button>
      <button class="hole"><span class="mole">🐹</span></button>
      <button class="hole"><span class="mole">🐹</span></button>
      <button class="hole"><span class="mole">🐹</span></button>
    </div>

    <button class="start-button" id="startButton">
      게임 시작!
    </button>

    <div id="message">
      시작 버튼을 눌러 게임을 시작해!
    </div>

    <div class="tip">
      제한 시간 30초! 최대한 많은 두더지를 잡아 봐!
    </div>
  </div>

  <script>
    let score = 0;
    let time = 30;
    let gameRunning = false;
    let currentMole = -1;

    let moleTimer = null;
    let countdownTimer = null;

    const holes = document.querySelectorAll(".hole");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");
    const bestText = document.getElementById("best");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    let bestScore = Number(localStorage.getItem("moleBest")) || 0;
    bestText.textContent = bestScore;

    function hideMoles() {
      holes.forEach(hole => {
        hole.classList.remove("active");
      });
      currentMole = -1;
    }

    function showMole() {
      if (!gameRunning) return;

      hideMoles();

      let randomNumber = Math.floor(Math.random() * 9);
      currentMole = randomNumber;

      holes[currentMole].classList.add("active");
    }

    holes.forEach((hole, index) => {
      hole.addEventListener("click", () => {
        if (!gameRunning) return;

        if (index === currentMole) {
          score++;
          scoreText.textContent = score;

          hideMoles();
          showMole();
        }
      });
    });

    function startGame() {
      if (gameRunning) return;

      score = 0;
      time = 30;

      scoreText.textContent = score;
      timeText.textContent = time;

      message.textContent = "두더지를 잡아 봐!";
      gameRunning = true;
      startButton.textContent = "게임 진행 중...";

      showMole();

      moleTimer = setInterval(showMole, 800);

      countdownTimer = setInterval(() => {
        time--;
        timeText.textContent = time;

        if (time <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      gameRunning = false;

      clearInterval(moleTimer);
      clearInterval(countdownTimer);

      hideMoles();

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("moleBest", bestScore);
        bestText.textContent = bestScore;

        message.textContent =
          "🎉 신기록 달성! 최종 점수: " + score + "점";
      } else {
        message.textContent =
          "게임 종료! 최종 점수: " + score + "점";
      }

      startButton.textContent = "다시 도전하기!";
    }

    startButton.addEventListener("click", startGame);
  </script>

</body>
</html>
