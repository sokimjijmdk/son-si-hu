

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>손시후의 목표와 소개</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --accent: #386641;
      --accent-dark: #284d31;
      --accent-light: #e3efdc;
      --accent-pale: #edf4e9;
      --cell-bg: #f8fbf6;
      --cell-border: #d9e5d4;
      --focus-color: #6b9b65;
    }

    /* 파란색 테마 */
    body.theme-blue {
      --accent: #2457a7;
      --accent-dark: #193f7a;
      --accent-light: #e0ebfb;
      --accent-pale: #eaf1fd;
      --cell-bg: #f6f9ff;
      --cell-border: #d3e0f5;
      --focus-color: #6c94d5;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7f2;
      color: #26352b;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    h1, h2, p {
      margin-top: 0;
    }

    /* 색상 선택 버튼 */
    .theme-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
      padding: 14px;
      background: white;
      border-radius: 16px;
    }

    .theme-label {
      width: 100%;
      text-align: center;
      margin-bottom: 2px;
      font-size: 14px;
      color: #59645b;
    }

    .theme-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 112px;
      padding: 10px 16px;
      border: 2px solid transparent;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      background: white;
      color: #26352b;
    }

    .theme-button[aria-pressed="true"] {
      border-color: #26352b;
      font-weight: bold;
    }

    .color-dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .green-dot {
      background: #386641;
    }

    .blue-dot {
      background: #2457a7;
    }

    /* D-day */
    .dday {
      background: var(--accent-light);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .dday-label {
      font-size: 15px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .dday-number {
      font-size: 36px;
      font-weight: bold;
      color: var(--accent);
    }

    /* 프로필 카드 */
    .profile {
      background: white;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 5px 20px #0000000a;
      margin-bottom: 24px;
    }

    .emoji {
      font-size: 64px;
      margin-bottom: 12px;
    }

    .profile h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .intro {
      line-height: 1.7;
      color: #59645b;
      margin-bottom: 20px;
    }

    .tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tag {
      background: var(--accent-pale);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
    }

    .github-button {
      display: inline-block;
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 10px;
    }

    .github-button:hover {
      background: var(--accent-dark);
    }

    /* 만다라트 목표표 */
    .goals {
      background: white;
      border-radius: 20px;
      padding: 24px 16px;
      box-shadow: 0 5px 20px #0000000a;
    }

    .goals h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .help {
      text-align: center;
      color: #748074;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .mandalart {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .goal-cell {
      width: 100%;
      min-width: 0;
      min-height: 100px;
      padding: 10px 5px;
      border: 1px solid var(--cell-border);
      border-radius: 10px;
      background: var(--cell-bg);
      color: #26352b;
      font-family: inherit;
      font-size: 13px;
      text-align: center;
      overflow-wrap: anywhere;
      resize: vertical;
    }

    .goal-cell:focus {
      outline: 2px solid var(--focus-color);
      background: white;
    }

    .goal-cell.center {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      font-weight: bold;
    }

    .goal-cell.center:focus {
      outline-color: var(--focus-color);
    }

    .reset-button {
      display: block;
      margin: 16px auto 0;
      padding: 10px 16px;
      border: none;
      border-radius: 9px;
      background: var(--accent-pale);
      color: var(--accent);
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 420px) {
      body {
        padding: 16px 10px;
      }

      .profile {
        padding: 24px 14px;
      }

      .goals {
        padding: 20px 10px;
      }

      .goal-cell {
        min-height: 90px;
        font-size: 12px;
        padding: 7px 3px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- 색상 선택 -->
    <section class="theme-picker">
      <p class="theme-label">🎨 원하는 색상을 선택하세요</p>

      <button
        class="theme-button"
        id="greenTheme"
        type="button"
        aria-pressed="true"
      >
        <span class="color-dot green-dot"></span>
        초록색
      </button>

      <button
        class="theme-button"
        id="blueTheme"
        type="button"
        aria-pressed="false"
      >
        <span class="color-dot blue-dot"></span>
        파란색
      </button>
    </section>

    <!-- D-day -->
    <section class="dday">
      <p class="dday-label">수능까지</p>
      <div class="dday-number" id="ddayNumber">D-390</div>
    </section>

    <!-- 프로필 카드 -->
    <section class="profile">
      <div class="emoji">🥬</div>

      <h1>손시후</h1>

      <p class="intro">
        공학과 식물을 좋아하는 고등학교 2학년입니다
      </p>

      <div class="tags">
        <span class="tag">📐 수학</span>
        <span class="tag">⚛️ 물리</span>
        <span class="tag">🌱 식물</span>
      </div>

      <!-- 본인의 GitHub 주소로 변경하세요 -->
      <a
        class="github-button"
        href="https://github.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        내 깃허브
      </a>
    </section>

    <!-- 만다라트 목표표 -->
    <section class="goals">
      <h2>나의 목표</h2>
      <p class="help">칸을 눌러서 고칠 수 있어요</p>

      <div class="mandalart" id="mandalart">
        <textarea class="goal-cell" aria-label="목표 1">매일 30분 영어 듣기</textarea>
        <textarea class="goal-cell" aria-label="목표 2">국어 오답노트</textarea>
        <textarea class="goal-cell" aria-label="목표 3">주 3회 운동</textarea>

        <textarea class="goal-cell" aria-label="목표 4">독서 월 2권</textarea>
        <textarea class="goal-cell center" aria-label="중심 목표">전기정보공학 진학</textarea>
        <textarea class="goal-cell" aria-label="목표 6">과학 동아리 발표</textarea>

        <textarea class="goal-cell" aria-label="목표 7">7시간 수면</textarea>
        <textarea class="goal-cell" aria-label="목표 8">봉사활동 20시간</textarea>
        <textarea class="goal-cell" aria-label="목표 9">코딩 포트폴리오</textarea>
      </div>

      <button class="reset-button" id="resetButton" type="button">
        처음 목표로 되돌리기
      </button>
    </section>

  </main>

  <script>
    // D-day를 D-390으로 고정
    document.getElementById("ddayNumber").textContent = "D-390";

    // 초록색 / 파란색 테마 선택
    const greenButton = document.getElementById("greenTheme");
    const blueButton = document.getElementById("blueTheme");

    function setTheme(theme) {
      const isBlue = theme === "blue";

      document.body.classList.toggle("theme-blue", isBlue);

      greenButton.setAttribute("aria-pressed", String(!isBlue));
      blueButton.setAttribute("aria-pressed", String(isBlue));

      // 선택한 색상 저장
      try {
        localStorage.setItem(
          "myPageTheme",
          isBlue ? "blue" : "green"
        );
      } catch (error) {
        console.log("테마 설정을 저장하지 못했습니다.");
      }
    }

    greenButton.addEventListener("click", () => {
      setTheme("green");
    });

    blueButton.addEventListener("click", () => {
      setTheme("blue");
    });

    // 저장된 색상 불러오기
    try {
      const savedTheme = localStorage.getItem("myPageTheme");

      if (savedTheme === "blue" || savedTheme === "green") {
        setTheme(savedTheme);
      }
    } catch (error) {
      console.log("테마 설정을 불러오지 못했습니다.");
    }

    // 만다라트 목표 저장 기능
    const cells = document.querySelectorAll(".goal-cell");
    const resetButton = document.getElementById("resetButton");
    const storageKey = "myMandalaGoals_v1";

    const defaultGoals = [
      "매일 30분 영어 듣기",
      "국어 오답노트",
      "주 3회 운동",
      "독서 월 2권",
      "전기정보공학 진학",
      "과학 동아리 발표",
      "7시간 수면",
      "봉사활동 20시간",
      "코딩 포트폴리오"
    ];

    // 저장된 목표 불러오기
    try {
      const savedGoals = localStorage.getItem(storageKey);

      if (savedGoals) {
        const goals = JSON.parse(savedGoals);

        cells.forEach((cell, index) => {
          if (typeof goals[index] === "string") {
            cell.value = goals[index];
          }
        });
      }
    } catch (error) {
      console.log("저장된 목표를 불러오지 못했습니다.");
    }

    // 목표를 수정하면 자동 저장
    cells.forEach((cell) => {
      cell.addEventListener("input", () => {
        const goals = Array.from(cells).map(
          (item) => item.value
        );

        try {
          localStorage.setItem(
            storageKey,
            JSON.stringify(goals)
          );
        } catch (error) {
          console.log("목표를 저장하지 못했습니다.");
        }
      });
    });

    // 기본 목표로 되돌리기
    resetButton.addEventListener("click", () => {
      const confirmed = confirm(
        "목표를 처음 상태로 되돌릴까요?"
      );

      if (!confirmed) return;

      cells.forEach((cell, index) => {
        cell.value = defaultGoals[index];
      });

      try {
        localStorage.setItem(
          storageKey,
          JSON.stringify(defaultGoals)
        );
      } catch (error) {
        console.log("목표를 저장하지 못했습니다.");
      }
    });
  </script>
</body>
</html>
